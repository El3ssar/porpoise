name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same branch or pull request makes an older run pointless: cancel it instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so file times can be restored for incremental builds
      # A fresh checkout stamps every file "now", which makes SwiftPM rebuild everything. Set each file's time to its
      # last commit, then restore the previous run's .build: only what changed since is compiled again.
      - name: Restore file times
        uses: chetan/git-restore-mtime-action@v2
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
      - name: Format
        run: swift format lint --strict -r Sources/PorpoiseCore Sources/PorpoiseFileSystem Sources/PorpoiseHelperKit Sources/PorpoiseServices Sources/Porpoise Sources/PorpoiseHelper Tests
      # The committed helper is rebuilt whenever what it's built from changes, and has no home folder paths in it.
      - name: Helper is current
        run: scripts/build-helper.sh --check
      # The app as released (the test support targets use @testable imports, which only build in debug).
      - name: Build
        run: swift build -c release --product Porpoise
      # The ffmpeg Porpoise ships, for the video preview tests (cached with the release workflow's).
      - name: Restore ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg/ffmpeg
            build/ffmpeg-src/ffmpeg-*/COPYING.*
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh
      # The search tools Porpoise bundles, for the search tests.
      - name: Fetch fd and ripgrep
        run: scripts/fetch-search-tools.sh
      - name: Tests
        run: scripts/test-with-watchdog.sh --enable-code-coverage
      - name: Coverage of the logic layers
        run: python3 scripts/coverage.py --min 92
