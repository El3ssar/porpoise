name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Format
        run: swift format lint --strict -r Sources/PorpoiseCore Sources/PorpoiseServices Sources/Porpoise Sources/PorpoiseHelper Tests
      - name: Build
        run: swift build -c release
      - name: Tests
        run: swift test --enable-code-coverage
      - name: Coverage of the logic layers
        run: python3 scripts/coverage.py --min 20
