name: CI
on:
  push:
    branches: [main, 'ci/**']
    paths-ignore: ['CHANGELOG.md', 'CONTRIBUTING.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_benchmark:
        description: 'Only benchmark release packaging (ad hoc signing, no secrets or publication)'
        type: boolean
        default: false
# A newer push to the same branch or pull request makes an older run pointless: cancel it instead of queueing.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release_benchmark && 'packaging' || 'checks' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  proof:
    if: ${{ !inputs.release_benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.proof.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse verification only for identical tested inputs
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-proof.py
  tests:
    needs: proof
    if: ${{ !inputs.release_benchmark && needs.proof.outputs.passed != 'true' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history, so file times can be restored for incremental builds
      # A fresh checkout stamps every file "now", which makes SwiftPM rebuild everything. Set each file's time to its
      # last commit, then restore the previous run's .build: only what changed since is compiled again.
      - name: Restore file times
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2
      - name: Toolchain identity
        id: toolchain
        run: echo "id=$( { swift --version; sw_vers -productVersion; } | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore build cache
        id: test-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-tests-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-tests-${{ hashFiles('Package.resolved', 'Package.swift') }}-
      - name: Workflow integrity
        run: python3 scripts/test-workflow-pins.py && python3 scripts/test-ci-proof.py && python3 scripts/test-bundled-tools.py && python3 scripts/test-performance-budgets.py && python3 scripts/test-test-completion.py
      - name: Crash symbol tooling
        run: python3 scripts/test-symbols.py && python3 scripts/test-release-dry-run.py && python3 scripts/test-app-intents-protocols.py
      - name: Format
        run: swift format lint --strict -r Sources/PorpoiseCore Sources/PorpoiseFileSystem Sources/PorpoiseHelperKit Sources/PorpoiseServices Sources/Porpoise Sources/PorpoiseCLI Sources/PorpoiseHelper Tests
      # The committed helper is rebuilt whenever what it's built from changes, and has no home folder paths in it.
      - name: Helper is current
        run: scripts/build-helper.sh --check
      # The ffmpeg Porpoise ships, for the video preview tests (cached with the release workflow's).
      - name: ffmpeg source identity
        id: ffmpeg-source
        run: |
          echo "sha=$(scripts/build-ffmpeg.sh --source-sha)" >> "$GITHUB_OUTPUT"
          echo "identity=$(scripts/build-ffmpeg.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/ffmpeg/ffmpeg
            build/ffmpeg/ffmpeg.sha256
            build/ffmpeg/identity.json
            build/ffmpeg/COPYING.LGPLv2.1
          key: ffmpeg-verified-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-source.outputs.sha }}-${{ steps.ffmpeg-source.outputs.identity }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/bundled-tool-cache.py') }}
      # Always verify the restored executable; a missing/mismatched digest rebuilds from verified source.
      - name: Verify or build ffmpeg
        run: scripts/build-ffmpeg.sh
      # The search tools Porpoise bundles, for the search tests.
      - name: Fetch fd and ripgrep
        run: scripts/fetch-search-tools.sh
      - name: Tests
        run: scripts/test-with-watchdog.sh --enable-code-coverage
      - name: Coverage of the logic layers
        run: python3 scripts/coverage.py --min 92
      - name: Save test compiler state even after a failed check
        if: ${{ !cancelled() && steps.test-cache.outputs.cache-primary-key != '' && steps.test-cache.outputs.cache-matched-key != steps.test-cache.outputs.cache-primary-key && hashFiles('.build/**/description.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.test-cache.outputs.cache-primary-key }}

  # The optimized shipping compile and the entire instrumented test suite use independent runners.
  shipping-build:
    needs: proof
    if: ${{ !inputs.release_benchmark && needs.proof.outputs.passed != 'true' }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Restore file times
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2
      - name: Toolchain identity
        id: toolchain
        run: echo "id=$( { swift --version; sw_vers -productVersion; } | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore shipping build cache
        id: shipping-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-shipping-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/make-app.sh') }}-${{ github.sha }}
          restore-keys: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-shipping-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/make-app.sh') }}-
      # Match make-app.sh's release compiler flags, including removal of build-machine paths.
      - name: Build shipping app
        run: |
          bin=$(swift build -c release --arch arm64 --show-bin-path)
          swift build -c release --arch arm64 -Xswiftc -file-prefix-map -Xswiftc "$bin/ModuleCache=$bin/ModuleCache" -Xswiftc -file-prefix-map -Xswiftc "$PWD=." -Xcc "-ffile-prefix-map=$bin/ModuleCache=$bin/ModuleCache" -Xcc "-ffile-prefix-map=$PWD=." --product Porpoise
      - name: Save shipping compiler state even after a failed build
        if: ${{ !cancelled() && steps.shipping-cache.outputs.cache-primary-key != '' && steps.shipping-cache.outputs.cache-matched-key != steps.shipping-cache.outputs.cache-primary-key && hashFiles('.build/**/description.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.shipping-cache.outputs.cache-primary-key }}

  performance-budgets:
    needs: proof
    if: ${{ !inputs.release_benchmark && needs.proof.outputs.passed != 'true' }}
    uses: ./.github/workflows/performance-budgets.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('{0}^', github.sha) }}

  # UI state/byte acceptance runs for normal CI, including ordinary UI source changes.
  # Captures remain review artifacts; absent screen access is never mislabeled a visual pass.
  ui-acceptance:
    needs: proof
    if: ${{ !inputs.release_benchmark && needs.proof.outputs.passed != 'true' }}
    uses: ./.github/workflows/ui-acceptance.yml

  # Preserve the existing required-check name: it must cover every required job.
  build-and-test:
    if: always() && !inputs.release_benchmark
    needs: [proof, tests, shipping-build, performance-budgets, ui-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require every CI gate
        env:
          TESTS: ${{ needs.tests.result }}
          SHIPPING: ${{ needs.shipping-build.result }}
          PERFORMANCE: ${{ needs.performance-budgets.result }}
          UI: ${{ needs.ui-acceptance.result }}
          PROOF: ${{ needs.proof.outputs.passed }}
          PROOF_STATUS: ${{ needs.proof.result }}
        run: |
          { test "$PROOF" = true && test "$PROOF_STATUS" = success; } || {
            test "$TESTS" = success && test "$SHIPPING" = success && test "$PERFORMANCE" = success && test "$UI" = success
          }
      - name: Attest the tested source tree
        if: needs.proof.outputs.passed != 'true'
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-proof.py --attest ci-proof.json
      - name: Retain trusted CI evidence
        if: needs.proof.outputs.passed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-proof.json
          if-no-files-found: error
          retention-days: 30

  # Explicitly requested timing probe: production build flags and DMG scans, without publishing or credentials.
  release-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.release_benchmark
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Restore file times
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2
      - name: Toolchain identity
        id: toolchain
        run: echo "id=$( { swift --version; sw_vers -productVersion; } | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore shipping build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-shipping-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/make-app.sh') }}-${{ github.sha }}
          restore-keys: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-shipping-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/make-app.sh') }}-
      - name: ffmpeg source identity
        id: ffmpeg-source
        run: |
          echo "sha=$(scripts/build-ffmpeg.sh --source-sha)" >> "$GITHUB_OUTPUT"
          echo "identity=$(scripts/build-ffmpeg.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/ffmpeg/ffmpeg
            build/ffmpeg/ffmpeg.sha256
            build/ffmpeg/identity.json
            build/ffmpeg/COPYING.LGPLv2.1
          key: ffmpeg-verified-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-source.outputs.sha }}-${{ steps.ffmpeg-source.outputs.identity }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/bundled-tool-cache.py') }}
      - name: Verify or build ffmpeg
        run: scripts/build-ffmpeg.sh
      - name: Build app and disk image
        env:
          PORPOISE_RELEASE: '1'
          PORPOISE_VERSION: '0.0.0'
        run: |
          scripts/make-app.sh
          codesign --verify --deep --strict build/Porpoise.app
          scripts/make-dmg.sh --no-build
      - name: Check disk image
        run: scripts/check-release.sh build/Porpoise-0.0.0.dmg
