# Merging a pull request labelled release:patch, release:minor or release:major publishes the next version:
# the latest vX.Y.Z tag bumped accordingly (v0.1.0 + release:minor → v0.2.0).
# pull_request_target, so pull requests from forks get the signing secrets too. That's safe here: it only runs
# once a maintainer has merged, and it builds the merged commit on main, never the fork's own branch.
name: Release on merge
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: read   # release.yml checks the commit's CI run

jobs:
  next-version:
    if: >-
      github.event.pull_request.merged &&
      (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:major'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Check existing full validation
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-proof.py
      - name: Wait for full main CI before releasing
        if: steps.proof.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # The merge event can arrive before Actions creates its main-push run.
          RUN=''
          for ((attempt=0; attempt<12; attempt++)); do
            RUN=$(gh run list --workflow ci.yml --branch main --event push --commit "$COMMIT" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN" ]; then
            echo '::error::No full main CI run or trusted proof for this merge. Complete full main CI, then rerun Release on merge.'
            exit 1
          fi
          gh run watch "$RUN" --interval 30 --exit-status
      - id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r MAJ MIN PAT <<< "${LAST:-v0.0.0}"; MAJ=${MAJ#v}
          case " $LABELS " in
            *" release:major "*) V="$((MAJ + 1)).0.0" ;;
            *" release:minor "*) V="$MAJ.$((MIN + 1)).0" ;;
            *)                   V="$MAJ.$MIN.$((PAT + 1))" ;;
          esac
          echo "${LAST:-none} → v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  release:
    needs: next-version
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.next-version.outputs.version }}
      commit: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit
