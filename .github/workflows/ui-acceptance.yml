name: UI acceptance
# Drives a test build through its debug bridge, in light and dark (Tests/UI/acceptance.py), and keeps the screenshots
# and results as an artifact. Structural checks fail the job; captures are for review (a runner without screen
# recording gives none, which is noted, not failed). Keyboard and VoiceOver checks need a person and aren't run here.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # Mondays
  pull_request:
    paths: ['Tests/UI/**', '.github/workflows/ui-acceptance.yml']
concurrency:
  group: ui-acceptance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ui-acceptance:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Restore file times
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2
      - name: Toolchain identity
        id: toolchain
        run: echo "id=$( { swift --version; sw_vers -productVersion; } | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-ui-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/make-app.sh') }}-${{ github.sha }}
          restore-keys: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-ui-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/make-app.sh') }}-
      # The app bundles ffmpeg (cached with CI's and the release workflow's, always verified).
      - name: ffmpeg source identity
        id: ffmpeg-source
        run: echo "sha=$(scripts/build-ffmpeg.sh --source-sha)" >> "$GITHUB_OUTPUT"
      - name: Restore ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/ffmpeg/ffmpeg
            build/ffmpeg/ffmpeg.sha256
            build/ffmpeg-src/ffmpeg-*/COPYING.*
          key: ffmpeg-verified-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-source.outputs.sha }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Verify or build ffmpeg
        run: scripts/build-ffmpeg.sh
      - name: Fetch fd and ripgrep
        run: scripts/fetch-search-tools.sh
      - name: Runner self-tests
        run: python3 -I Tests/UI/test_acceptance.py
      # A test build: the debug bridge is only in debug builds with PORPOISE_TEST_HOOKS, never in a release.
      - name: Build the test app
        run: CONFIG=debug scripts/make-app.sh
      - name: Acceptance run (light and dark)
        run: python3 -I Tests/UI/acceptance.py --out build/ui-acceptance/run
      - name: Summary
        if: always()
        run: test -f build/ui-acceptance/run/SUMMARY.md && cat build/ui-acceptance/run/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-acceptance-${{ github.run_id }}
          path: build/ui-acceptance/run
          retention-days: 30
          if-no-files-found: warn
