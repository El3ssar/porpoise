name: Published release compatibility
# Manual plus narrowly scoped runner changes: no matrix on everyday app PRs.
on:
  pull_request:
    paths:
      - .github/workflows/release-compatibility.yml
      - Tests/UI/release_smoke.py
      - Tests/UI/test_release_smoke.py
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag (vX.Y.Z)'
        type: string
        default: v0.19.4
        required: true
permissions:
  contents: read
concurrency:
  group: published-release-${{ github.ref }}-${{ inputs.tag || 'v0.19.4' }}
  cancel-in-progress: true
jobs:
  published-release:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Runner and toolchain identity
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          sysctl -n hw.model
          xcodebuild -version
          swift --version
      - name: Runner fixture tests (no app)
        run: python3 -I Tests/UI/test_release_smoke.py
      - name: Validate and run the published app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.19.4' }}
        run: python3 -I Tests/UI/release_smoke.py --tag "$RELEASE_TAG" --out build/published-release
      - name: Summary
        if: always()
        run: test ! -f build/published-release/SUMMARY.md || cat build/published-release/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep results and app log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-release-${{ matrix.runner }}-${{ github.run_id }}
          path: build/published-release
          retention-days: 30
          if-no-files-found: warn
