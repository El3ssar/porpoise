name: Performance budgets
on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Base commit to compare under the same workload'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Full base commit SHA'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      effective_base: ${{ steps.scope.outputs.effective_base }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Performance policy and evidence regressions
        run: |
          python3 scripts/test-performance-budgets.py
          python3 scripts/test-performance-inputs.py
      - name: Resolve measured performance evidence
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ inputs.base_ref }}
          FRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [ "$FRESH" = true ]; then args+=(--force-measure); fi
          python3 scripts/performance-inputs.py --base "$BASE_REF" --out build/performance-scope "${args[@]}"
          cat build/performance-scope/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain evidence decision
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-scope-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: build/performance-scope/
  compare:
    needs: scope
    # Evidence-only decisions never allocate a macOS runner or launch the app.
    runs-on: ${{ needs.scope.outputs.mode == 'measure' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Record performance evidence
        if: ${{ needs.scope.outputs.mode == 'reuse' }}
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON. See the retained performance-scope artifact for the measured origin." >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce performance evidence
        if: ${{ needs.scope.outputs.mode == 'blocked' }}
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: |
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Budget policy regressions
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        run: python3 scripts/test-performance-budgets.py
      - name: ffmpeg source identity
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        id: ffmpeg-source
        run: |
          echo "sha=$(scripts/build-ffmpeg.sh --source-sha)" >> "$GITHUB_OUTPUT"
          echo "identity=$(scripts/build-ffmpeg.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore ffmpeg
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/ffmpeg/ffmpeg
            build/ffmpeg/ffmpeg.sha256
            build/ffmpeg/identity.json
            build/ffmpeg/COPYING.LGPLv2.1
          key: ffmpeg-verified-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-source.outputs.sha }}-${{ steps.ffmpeg-source.outputs.identity }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/bundled-tool-cache.py') }}
      - name: Verify or build ffmpeg
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        env:
          FFMPEG_JOBS: '2'
        run: scripts/build-ffmpeg.sh
      - name: Optimized compiler cache identity
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        id: compiler
        run: |
          identity=$( { swift --version; xcodebuild -version; sw_vers -productVersion; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore private optimized compiler cache
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only SwiftPM build state and content-checked source timestamps. Staged apps/results stay fresh.
          path: .build-budgets
          # Split compile inputs from the measurement runner: trial-only Python edits can reuse
          # compiler state. Bump this namespace if preparation/instrumentation/cache layout changes.
          key: budgets-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Benchmarks/PerformanceBudgets/**', 'scripts/make-app.sh') }}-${{ hashFiles('scripts/performance-budgets.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            budgets-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Benchmarks/PerformanceBudgets/**', 'scripts/make-app.sh') }}-${{ hashFiles('scripts/performance-budgets.py') }}-
            budgets-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Benchmarks/PerformanceBudgets/**', 'scripts/make-app.sh') }}-
            budgets-swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Benchmarks/PerformanceBudgets/**', 'scripts/performance-budgets.py', 'scripts/make-app.sh') }}-
      - name: Compare identical optimized app workloads
        if: ${{ needs.scope.outputs.mode == 'measure' }}
        timeout-minutes: 27
        env:
          BASE_REF: ${{ needs.scope.outputs.effective_base }}
        run: python3 scripts/performance-budgets.py --reuse-compiler-cache --base "$BASE_REF" --out "$PWD/build/performance-budgets"
      - name: Save validated optimized compiler state
        # Retain successful source preparation even when the measurement verdict fails.
        if: ${{ needs.scope.outputs.mode == 'measure' && (!cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && hashFiles('build/performance-budgets/preparation.json') != '') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-budgets
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Summary
        if: ${{ needs.scope.outputs.mode == 'measure' && (!cancelled()) }}
        run: |
          if [ -f build/performance-budgets/SUMMARY.md ]; then
            cat build/performance-budgets/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Performance validation failed before a complete matched comparison. See retained logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain all measurements and failure logs
        if: ${{ needs.scope.outputs.mode == 'measure' && (!cancelled()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-budgets-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/performance-budgets/results.json
            build/performance-budgets/prepared.json
            build/performance-budgets/preparation.json
            build/performance-budgets/SUMMARY.md
            build/performance-budgets/*-build.log
            build/performance-budgets/trials/*/*.json
            build/performance-budgets/trials/*/app.log
