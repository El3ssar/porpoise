name: Dependency review
on:
  pull_request:
  schedule:
    - cron: '17 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Workflow action pins
        run: python3 scripts/check-workflow-pins.py && python3 scripts/test-dependency-inputs.py
      - name: Identify dependency changes
        id: inputs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/dependency-inputs.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
      - name: No graph-covered dependency changes
        if: github.event_name == 'pull_request' && steps.inputs.outputs.graph_required == 'false'
        run: echo 'Swift package manifests/lockfiles and action pins are unchanged. Graph review is not applicable; this is not an advisory scan.' >> "$GITHUB_STEP_SUMMARY"
      - name: Propose dependency maintenance review
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/dependency-review.py --output dependency-proposal.md
          else
            python3 scripts/dependency-review.py --online --output dependency-proposal.md
          fi
          cat dependency-proposal.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain review proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-review-proposal
          path: dependency-proposal.md
          retention-days: 90
      - name: Review dependency graph changes
        if: github.event_name == 'pull_request' && steps.inputs.outputs.graph_required == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
