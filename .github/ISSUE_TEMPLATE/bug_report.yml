name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Porpoise version
      description: Porpoise › About Porpoise
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 15.4 or 26.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics (optional)
      description: |
        For a failed job, include its Activity error or the relevant operation-history excerpt.
        For a crash, attach the Porpoise .ips report from Console; for a hang, use Activity Monitor > Porpoise > Sample Process.
        Review attachments for private paths, filenames, server names and account information. Remove sensitive details; never include passwords, tokens or keys.
